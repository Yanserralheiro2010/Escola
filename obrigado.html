<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Enviada</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a
            );
        }

        .container {
            width: 100%;
            max-width: 500px;

            background-color: white;
            border-radius: 18px;

            padding: 50px 40px;

            text-align: center;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            color: #172554;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;

            border: none;
            border-radius: 10px;

            padding: 16px 32px;

            background-color: #2563eb;
            color: white;

            font-size: 17px;
            font-weight: bold;

            text-decoration: none;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="icon">✅</div>

        <h1>Mensagem enviada!</h1>

        <p>
            Obrigado pelo contato! Sua mensagem foi enviada com sucesso
            para <strong>yandavidnogueiraserralheiro@gmail.com</strong>.
            <br><br>
            Responderei o mais breve possível.
        </p>

        <a class="btn" href="index.html">
            Voltar para o site
        </a>

    </main>

</body>
</html>
