<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Lojinha Camargo</title>
  <link rel="stylesheet" href="css/style2.css" />
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="brand">
        <span class="brand-icon">🛒</span>
        <span class="brand-title">Lojinha Camargo</span>
      </div>

      <h1 class="title">Entrar</h1>

      <form id="login-form" class="form" action="index.html" method="GET">
        <label class="label" for="email">Email</label>
        <input
          class="input"
          id="email"
          name="email"
          type="email"
          placeholder="seuemail@exemplo.com"
          required
        />

        <label class="label" for="senha">Senha</label>
        <input
          class="input"
          id="senha"
          name="senha"
          type="password"
          placeholder="Sua senha"
          required
        />

        <button class="btn" type="submit">Fazer login</button>
      </form>

      <p class="hint">(Login simples: ao enviar você é redirecionado para <strong>Lojinha Camargo</strong>.)</p>
    </div>
  </div>
</body>
</html>
